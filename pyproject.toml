[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rex-arsenal"
version = "2.0.0"
description = "One-Link Reverse Engineering Meta-Repository, Modular CLI Engine, Minecraft Intelligence Pack, and MCP Auto-Installer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
rex = "rex.cli:main"

[project.urls]
Homepage = "https://github.com/rex-arsenal/REX"
