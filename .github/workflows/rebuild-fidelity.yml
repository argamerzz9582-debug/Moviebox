name: MovieBox — high-fidelity repack (signature-only change)

# Keeps every app entry from the original APK byte-for-byte and changes only the
# signer. This removes the entire class of "recompiled resources/dex" startup
# crashes that an apktool round-trip can introduce.
#
# It also reports whether the APK is protected/signature-checking, because in
# that case no re-signed build can run at all.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the signed APK'
        type: boolean
        default: true

permissions:
  contents: write
concurrency:
  group: moviebox-fidelity
  cancel-in-progress: false

env:
  APK_DRIVE_FILE_ID: '1yTSTuPz5VUeTw4Gt3FSj1h-ryCqQyO_J'
  APK_BASENAME: 'MovieBox_v4.0.02.0831.03.apk'
  REA_VERSION: '6.8.0'
  APKTOOL_VERSION: '3.0.3'
  JADX_MCP_VERSION: '0.7.1'
  JADX_MCP_SHA256: '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75'
  GHIDRA_VERSION: '12.1.4'
  GHIDRA_ZIP: 'ghidra_12.1.4_PUBLIC_20260921.zip'
  BUILD_TOOLS: '35.0.0'
  SMALI_VERSION: '3.0.9'
  UBER_APK_SIGNER_VERSION: '1.3.0'

defaults:
  run:
    shell: bash

jobs:
  rebuild:
    name: Fidelity repack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Resolve toolchain
        env:
          RUN_GHIDRA: 'false'
        run: bash scripts/install-tools.sh

      - name: Fetch source APK
        run: bash scripts/fetch-apk.sh

      - name: Inventory + protection verdict
        run: |
          set -uo pipefail
          python3 scripts/detect-protection.py "apk/${APK_BASENAME}" > reports/protection.json 2> reports/protection.txt || true
          cat reports/protection.txt
          python3 - <<'PY'
          import json
          d = json.load(open("reports/protection.json"))
          v = d["verdict"]
          for product, files in d.get("packers", {}).items():
              print(f"::error title=protector::{product} ({', '.join(files[:3])})")
          for k, info in d.get("markers", {}).items():
              print(f"::warning title=marker::{k}: {info['matches']} matches")
          print(f"::notice title=verdict::{v['state']} — {v['reason'][:500]}")
          PY

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: bash scripts/keystore.sh

      - name: High-fidelity repack + sign
        run: bash scripts/repack-fidelity.sh

      - name: Verify
        run: bash scripts/verify.sh

      - name: Failure diagnostics
        if: failure()
        run: bash scripts/diagnostics.sh

      - name: Build report
        if: always()
        run: python3 scripts/report.py || echo "report generation failed (non-fatal)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moviebox-fidelity-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/
            build/*.apk
            build/*.txt

      - name: Publish release
        if: success() && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          FIDELITY: '1'
        run: bash scripts/publish-release.sh

      - name: Job summary
        if: always()
        run: bash scripts/summary.sh
